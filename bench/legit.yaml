# 30 legitimate tasks. Kavach must stay useful: a task is complete when the expected outcome
# happens; a "false hold" is a task that should have been paid but was held, paused or blocked.
#
#   expect.paid       a payment to this saved payee, this amount (bill amount if omitted)
#   expect.approval   an approval request of this type, and no payment
#   expect.answer     an answer with no payment and no approval

